<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="logo-spine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F5F5F5"/>
      <stop offset="70%" stop-color="#A3A3A3"/>
      <stop offset="100%" stop-color="#737373"/>
    </linearGradient>
    <linearGradient id="logo-loop" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F5F5F5"/>
      <stop offset="75%" stop-color="#D4D4D4"/>
      <stop offset="100%" stop-color="#8A8A8A"/>
    </linearGradient>
    <linearGradient id="logo-leg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E5E5E5"/>
      <stop offset="70%" stop-color="#A3A3A3"/>
      <stop offset="100%" stop-color="#525252"/>
    </linearGradient>
    <linearGradient id="logo-depth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#525252"/>
      <stop offset="50%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <!-- 3D Monogram Mark (40x40 at x=5, y=5) -->
  <g transform="translate(5, 5) scale(0.4)">
    <path d="M 17 23 L 26 15 L 26 83 L 17 76 Z" fill="url(#logo-depth)"/>
    <path d="M 26 15 L 41 15 L 41 85 L 26 85 Z" fill="url(#logo-spine)"/>
    <path d="M 17 23 L 26 15 L 41 15 L 34 23 Z" fill="#FFFFFF" fill-opacity="0.9"/>
    
    <path d="M 41 40 L 41 55 L 35 52 L 35 42 Z" fill="#000000" fill-opacity="0.45"/>
    <path d="M 41 54 L 41 72 L 34 68 L 34 50 Z" fill="#000000" fill-opacity="0.5"/>

    <path d="M 41 15 L 63 15 C 76 15 84 24 84 36 C 84 48 74 55 60 55 L 41 55 Z M 41 27 L 58 27 C 65 27 69 30 69 35 C 69 40 65 43 58 43 L 41 43 Z" 
          fill="url(#logo-loop)" 
          fill-rule="evenodd"/>
    <path d="M 41 15 L 63 15 C 76 15 84 24 84 36 L 80 36 C 80 26 73 18 63 18 L 41 18 Z" fill="#FFFFFF" fill-opacity="0.85"/>

    <path d="M 45 47 L 59 47 L 83 85 L 68 85 Z" fill="url(#logo-leg)"/>
    <path d="M 45 47 L 59 47 L 61 45 L 47 45 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <path d="M 68 85 L 83 85 L 77 89 L 62 89 Z" fill="url(#logo-depth)"/>
  </g>

  <!-- Typography: ReWise -->
  <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.5" fill="#E5E5E5">
    Re<tspan font-weight="700" fill="#FFFFFF">Wise</tspan>
  </text>
  <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" letter-spacing="0.2" fill="#737373">
    ACTIVE LEARNING ENGINE
  </text>
</svg>
